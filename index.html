<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wojciech Hryniewicki</title>
<script>try{if(localStorage.getItem('wh-mode')==='light')document.documentElement.dataset.mode='light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>
/* Dark, tidy amp face: one column, knobs and logo on one line, video below at the same width */
:root{color-scheme:dark;--bg:#0b0b0c;--ink:#f1efe9;--dim:#8f8c85;--scale:#bdb9b0;--line:#1d1d20;--logo:linear-gradient(#c00000,#5a0000 72%,#4a0000);--hot:#ff3b30;
  --w:min(100%,880px,calc((100svh - 314px) * 16 / 9))}
@supports not (height:1svh){:root{--w:min(100%,880px,calc((100vh - 314px) * 16 / 9))}}
/* Light version: warm grey page, black outline controls. The video, and the logo controls on it, stay dark. */
:root[data-mode=light]{color-scheme:light;--bg:#d8d5cc;--ink:#111;--dim:#46433d;--scale:#222;--line:#b9b5ab}
:root[data-mode=light] .frame{box-shadow:0 0 0 1px #0000001a,0 18px 40px -22px #0007}
:root[data-mode=light] .odbtn.on .lamp{fill:#c40000;stroke:#c40000;filter:none}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;overflow-x:clip}
.page{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:24px max(4vw,16px)}
.wrap{width:max(var(--w),min(100%,620px));margin:0 auto;container-type:inline-size}

/* Gain and Overdrive left, small logo in the middle, Light and Type right */
.knobs{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;margin:0 auto 24px;max-width:600px}
.knobs>.right{justify-self:end}
/* Small logo between the controls (just the picture; the playing controls are on the video) */
.badge{display:block;width:96px;height:96px}
.badge .ln{stroke:url(#logog);fill:none}
:root[data-mode=light] .badge .ln{stroke:#111}
.knobs>.left{justify-self:start;display:flex;align-items:flex-start;gap:14px}
/* Controls are simple outline drawings (dark: white lines, light: black lines) */
.od,.lt,.k{display:flex;flex-direction:column;align-items:center;gap:8px}
.od>span,.lt>span,.k span{font:700 12px/14px system-ui,sans-serif;letter-spacing:.14em;color:var(--ink)}
/* Overdrive: lamp above a round footswitch */
.odbtn,.ltbtn{border:0;padding:0;background:none;cursor:pointer;display:block;-webkit-tap-highlight-color:transparent}
.odbtn svg{display:block;width:56px;height:96px;overflow:visible}
.odbtn .lamp{fill:none;stroke:var(--ink);stroke-width:1.6;transition:fill .15s}
.odbtn.on .lamp{fill:#e0312a;stroke:#e0312a;filter:drop-shadow(0 0 5px #e0312a)}
.odbtn .ol{fill:none;stroke:var(--ink)}
.odbtn:active svg{transform:scale(.96)}
/* Light switch: lever down = dark, lever up = light */
.ltbtn svg{display:block;width:40px;height:96px;overflow:visible}
.ltbtn .ol{fill:none;stroke:var(--ink)}
.ltbtn .lever{transform-origin:20px 54px;transition:transform .15s;transform:rotate(180deg)}
.ltbtn.on .lever{transform:rotate(0deg)}
.ltbtn .stick{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.ltbtn .tip{fill:var(--ink)}
.odbtn:focus-visible,.ltbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.knobs>.right{display:flex;align-items:flex-start;gap:10px}
.k svg{display:block;width:96px;height:96px;touch-action:none;cursor:grab;outline:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.k.wide svg{width:154px}
.scale text{font:600 9px system-ui,sans-serif;fill:var(--scale);letter-spacing:.04em;cursor:pointer}
.scale text.off{cursor:default}
.k.wide .scale text{letter-spacing:.06em;transition:opacity .2s}
.scale text.off{opacity:.3}
.cap{fill:var(--bg);stroke:var(--ink);stroke-width:1.6}
.ptr{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.ring{fill:none;stroke:var(--ink);stroke-width:2.5}
.ticks line{stroke:var(--scale);stroke-width:1.5;stroke-linecap:round}
/* Player controls: the logo, big, on top of the video. It fades away 1 second after the last touch while a video plays. */
.ctrls{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.8;
  background:radial-gradient(closest-side,#000a,#0000);transition:opacity .35s}
.ctrls.hide{opacity:0}
.ctrls.hide .z{pointer-events:none}
.frame.plainmode .ctrls{display:none}
.logo{position:relative;display:block;height:min(52%,220px);aspect-ratio:185/180;transform:translateY(10%)}
.frame.short .logo{height:min(40%,220px);transform:translateY(28%)}
/* The logo is built from five lines and is also the player:
   first line = play/pause switch, crossbar = progress, last line = volume */
.logo .ln{position:absolute;background:var(--logo)}
.logo .t{top:2.22%;height:95.56%;width:3.24%;background-size:100% 100%}
.logo .l1{left:3.51%}.logo .l3{left:48.11%}.logo .l4{left:92.43%}
.logo .l2{left:25.95%;top:48.33%;height:49.44%;width:3.24%;background-size:100% 193.3%;background-position:0 100%}
.logo .h{left:25.95%;top:48.33%;width:46.22%;height:2.78%;background-size:100% 3440%;background-position:0 49.7%}
.logo .hfill{position:absolute;left:25.95%;top:48.33%;height:2.78%;width:0;background:var(--hot);pointer-events:none}
.logo .dot{position:absolute;width:8%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
  background:#000;box-shadow:inset 0 0 0 2px #fff;transition:top .2s}
.logo .dplay{left:5.13%;top:88.9%}
.logo.playing .dplay{top:11.1%;background:var(--hot);box-shadow:inset 0 0 0 2px var(--hot)}
.logo .dprog{top:49.72%;left:25.95%;transition:none}
.logo .dvol{left:94.05%;top:2.22%;transition:none}
.logo .z{position:absolute;z-index:2;pointer-events:auto;border:0;padding:0;margin:0;background:none;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
.logo .zplay{left:-4%;width:18%;top:0;height:100%}
.logo .zprog{left:20%;width:58%;top:37%;height:26%}
.logo .zvol{left:84%;width:20%;top:0;height:100%;cursor:ns-resize}
.logo .z:focus-visible{outline:2px solid #fff;outline-offset:1px;border-radius:4px}
/* Names under the logo, in the same lettering as the knob names */
.logo .lbl{position:absolute;white-space:nowrap;pointer-events:none;
  font:700 12px/14px system-ui,sans-serif;letter-spacing:.14em;color:#fff;text-shadow:0 1px 3px #000;top:calc(100% + 10px);transform:translateX(-50%)}
/* Wide videos: PLAY beside the first line, VOLUME beside the last line, TIME under the crossbar.
   Upright videos (narrow): all three names under their own lines. */
.logo .lbl-time{left:49.06%}
.logo .lbl-play{left:auto;right:calc(100% + 14px);top:50%;transform:translateY(-50%)}
.logo .lbl-vol{left:calc(100% + 14px);top:50%;transform:translateY(-50%)}
.frame.short .logo .lbl-play{right:auto;left:5.13%;top:calc(100% + 10px);transform:translateX(-50%)}
.frame.short .logo .lbl-vol{left:94.05%;top:calc(100% + 10px);transform:translateX(-50%)}

/* Video: frameless. The stage keeps one fixed height for every video, so nothing moves when a knob turns.
   Wide videos sit in its vertical centre, Shorts stand inside it at the same height. */
.stage{display:flex;justify-content:center;align-items:center;
  height:calc(min(100vw - 32px,880px) * 9 / 16);height:calc(100cqw * 9 / 16)}
.frame{position:relative;overflow:hidden;background:#000;border-radius:8px;aspect-ratio:16/9;width:100%;
  box-shadow:0 0 0 1px var(--line),0 16px 40px -24px #000}
.frame.short{aspect-ratio:9/16;width:auto;height:100%}
#player,.frame iframe{position:absolute;left:0;width:100%;border:0}
/* Trick: the player is 3 times taller than the box. The video sits in the middle third,
   while YouTube's title bar (top) and logo (bottom) fall outside the box and are cut off. */
#player,.frame iframe{top:-100%;height:300%;pointer-events:none}
.frame.direct iframe{pointer-events:auto}
.frame iframe#plain{top:0;height:100%;pointer-events:auto;z-index:2}
.frame iframe#plain.hidden{display:none}
.cover{position:absolute;inset:0;z-index:3;border:0;padding:0;margin:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.poster{position:absolute;inset:0;background:#000 center/cover no-repeat}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 55%,#0006)}
.cover:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.hidden{display:none}

/* Watermark: the logo in the corner of every video */
.wm{position:absolute;z-index:4;right:14px;bottom:14px;width:34px;height:34px;pointer-events:none;opacity:.9}
.wm .ln{stroke:url(#logog);fill:none}
.frame.short .wm{width:28px;height:28px;right:10px}



/* Footer */
/* Footer: small, the same distance under the video as the controls are above it */
footer{width:max(var(--w),min(100%,620px));margin:24px auto 0;padding:8px 0 10px;border-top:1px solid var(--line)}
.social{list-style:none;margin:0;padding:0;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 28px}
.social a{display:inline-flex;align-items:center;min-height:36px;padding:0 4px;color:var(--dim);text-decoration:none;
  font:600 11px/1 Oswald,Impact,sans-serif;letter-spacing:.16em;transition:color .15s}
.social a:hover,.social a:focus-visible{color:var(--ink)}
.social a:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px}

@media(max-width:700px){
  .page{padding:20px 12px 0;height:100vh;height:100svh}
  /* Phone: the video area takes the free space between the controls and the footer, and sits in its middle */
  .wrap{margin:0 auto;flex:1;display:flex;flex-direction:column;width:100%}
  footer{margin-top:0;width:100%}
  .knobs{margin-bottom:16px;max-width:none;display:flex;justify-content:space-between}
  .badge{width:46px;height:56px;margin-top:12px}
  .logo .lbl{font-size:10px;letter-spacing:.08em}
  .k svg{width:80px;height:80px}
  .knobs>.left{gap:4px}
  .odbtn svg{width:46px;height:80px}
  .od>span,.lt>span,.k span{font-size:10px;letter-spacing:.06em}
  .ltbtn svg{width:32px;height:80px}
  .k.wide svg{width:118px}
  /* Video edge to edge; the area is up to 58% of the screen height, wide videos centred in it, Shorts fill its height */
  .stage{flex:0 1 58vh;flex-basis:58svh;height:auto;min-height:calc(100vw * 9 / 16);margin:auto -12px;align-items:center}
  .frame{border-radius:0;box-shadow:none}
  .frame.short{height:100%;border-radius:10px}
  .social{gap:0 20px}.social a{font-size:11px;letter-spacing:.1em}
}
@media(max-width:389px){
  .k svg{width:72px;height:72px}
  .odbtn svg{width:42px;height:72px}
  .od>span,.lt>span{font-size:9.5px;letter-spacing:.03em}
  .ltbtn svg{width:30px;height:72px}
  .knobs>.right{gap:6px}
  .badge{width:40px;height:52px}
  .k.wide svg{width:104px}
  .knobs>.left{gap:0}
}
@media(max-width:340px){
  .k svg{width:62px;height:62px}.k.wide svg{width:92px}
  .odbtn svg{width:36px;height:62px}.ltbtn svg{width:26px;height:62px}.badge{width:32px;height:44px}
  .od>span,.lt>span,.k span{font-size:9px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(forced-colors:active){
  .cap{fill:Canvas!important;stroke:CanvasText!important;stroke-width:2}.ptr{stroke:Highlight}.ring{stroke:CanvasText!important}
  .scale text{fill:CanvasText}.ticks line{stroke:CanvasText!important}.scale text.off{fill:GrayText}.frame{border:1px solid CanvasText}
  .logo .lbl{color:CanvasText;text-shadow:none}.ctrls{background:none}
  .logo .ln{forced-color-adjust:none;background:CanvasText!important}.logo .hfill{forced-color-adjust:none;background:Highlight}
  .logo .dot{forced-color-adjust:none;background:Canvas;box-shadow:inset 0 0 0 2px CanvasText}.logo.playing .dplay{background:Highlight;box-shadow:inset 0 0 0 2px Highlight}.logo .z:focus-visible{outline-color:Highlight}
  .cover:focus-visible{outline-color:Highlight}
  .ltbtn .stick{stroke:ButtonText!important}.ltbtn .tip{fill:ButtonText!important}.ltbtn.on .stick{stroke:Highlight!important}.ltbtn.on .tip{fill:Highlight!important}.ltbtn:focus-visible{outline-color:Highlight}
  .odbtn .ol,.ltbtn .ol{stroke:ButtonText!important}.odbtn .lamp{stroke:ButtonText!important;fill:Canvas!important;filter:none!important}.odbtn.on .lamp{fill:Highlight!important;stroke:Highlight!important}
  .odbtn:focus-visible{outline-color:Highlight}
  .wm .ln,.badge .ln{stroke:CanvasText!important}
  footer{border-top-color:CanvasText}.social a{color:LinkText}.social a:focus-visible{outline-color:Highlight}
}
</style>
</head>
<body>
<div class="page"><div class="wrap">
  <div class="knobs" id="knobs"></div>
  <div class="stage">
    <div class="frame" id="frame">
      <div id="player"></div>
      <iframe id="plain" class="hidden" title="Video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      <button class="cover" id="cover" aria-label="Play video">
        <span class="poster" id="poster"></span>
      </button>
      <div class="ctrls" id="ctrls">
  <div class="logo" id="logo" role="group" aria-label="Wojciech Hryniewicki logo and player">
    <span class="ln t l1"></span><span class="ln l2"></span><span class="ln t l3"></span><span class="ln t l4"></span><span class="ln h"></span>
    <span class="hfill" id="lgFill"></span>
    <span class="dot dplay"></span><span class="dot dprog" id="lgProg"></span><span class="dot dvol" id="lgVol"></span>
    <button class="z zplay" id="lgPlay" aria-label="Play"></button>
    <span class="z zprog" id="lgSeek" tabindex="0" role="slider" aria-label="Video position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></span>
    <span class="lbl lbl-play" aria-hidden="true">PLAY</span><span class="lbl lbl-time" aria-hidden="true">TIME</span><span class="lbl lbl-vol" aria-hidden="true">VOLUME</span>
    <span class="z zvol" id="lgVolZ" tabindex="0" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"></span>
  </div>
      </div>
      <svg class="wm" viewBox="100 80 185 180" aria-hidden="true"><g class="ln" stroke-width="6"><line x1="109.5" y1="84" x2="109.5" y2="256"/><line x1="192" y1="84" x2="192" y2="256"/><line x1="274" y1="84" x2="274" y2="256"/><line x1="151" y1="167" x2="151" y2="256"/><line x1="148" y1="169.5" x2="233.5" y2="169.5" stroke-width="5"/></g></svg>
    </div>
  </div>
</div>
<footer>
  <ul class="social">
    <li><a href="https://www.instagram.com/paradoxognososynggrafikos/" target="_blank" rel="noopener">INSTAGRAM</a></li>
    <li><a href="https://soundcloud.com/wojciech-hryniewicki/" target="_blank" rel="noopener">SOUNDCLOUD</a></li>
    <li><a href="https://www.youtube.com/@wojciechhryniewicki" target="_blank" rel="noopener">YOUTUBE</a></li>
  </ul>
</footer>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="logog" gradientUnits="userSpaceOnUse" x1="0" y1="84" x2="0" y2="256"><stop offset="0" stop-color="#990000"/><stop offset=".72" stop-color="#3a0000"/><stop offset="1" stop-color="#370000"/></linearGradient>
</defs></svg>

<script>
{
/* ================= VIDEO LIBRARY: the only part to edit =================
   Each Type has two lists. Both go from the lightest video (Gain 0) to the heaviest (Gain 10).
     clean      shown when Overdrive is off
     overdrive  shown when Overdrive is on (leave it as [] if there are none yet)
   Write each video as its YouTube ID in quotes, for example "im13LzBOD_w".
   (In a link like https://youtu.be/im13LzBOD_w the ID is the part after the last slash.)
   The page finds out by itself if a video is upright or wide. If it gets one wrong,
   write that video like this instead: {id:"i6rgYLaGDbg", shape:"upright"}  or  shape:"wide"
   ========================================================================= */
const LIBRARY=[
  {label:"DRUMS",  name:"Drums",
    clean:[],          /* coming soon: add drum videos here, lightest first */
    overdrive:[]},
  {label:"KEYS",   name:"Keys",
    clean:["im13LzBOD_w","DEANSHDWww0","AG3WGAEKPGY","6VrBtL-pBQk"],
    overdrive:[]},
  {label:"GUITAR", name:"Guitar Only",
    clean:["74Fn6fPGEnE","quwbFH3pn8A"],
    overdrive:[]},
  {label:"SONGS",  name:"Full Songs",
    clean:["2iNbePz8Ao0","n-DhYip3wh8",{id:"i6rgYLaGDbg",shape:"upright"},"tCl8g3aSStY","ZwpYgKk2IPk","ggS8HsNWE3s","73ziziUBd6U"],
    overdrive:["uso0dnW1UiI","x3fvDBi8R0g"]}
];
/* ======================== end of video library ========================== */

const norm=e=>typeof e==="string"?{id:e}:{id:e.id,f:e.shape==="upright"?true:e.shape==="wide"?false:undefined};
const types=LIBRARY.map(t=>({label:t.label,name:t.name,clean:(t.clean||[]).map(norm),overdrive:(t.overdrive||[]).map(norm)}));
let od=false;
/* Which list is showing, and which Type positions have videos in the current mode */
const listOf=i=>od?types[i].overdrive:types[i].clean;
const usable=i=>listOf(i).length>0;
const knobs=[
  {id:"gain",label:"GAIN",v:0,steps:0},   /* v = which video in the list (0 = lightest) */
  {id:"type",label:"TYPE",v:0,steps:types.length}
];
const A0=-135,A1=135;
/* Type labels spread wider when there are more of them */
const TA={2:[-40,40],3:[-55,0,55],4:[-80,-30,30,80],5:[-90,-48,0,48,90]}[types.length]||types.map((t,i)=>-90+i*180/(types.length-1));
const get=id=>knobs.find(k=>k.id===id);
/* Gain: the videos are spread evenly over the knob's turn, one tick mark each */
const gainAng=(i,n)=>n>1?A0+i/(n-1)*(A1-A0):A0;
const ang=k=>k.steps?TA[k.v]:gainAng(k.v,listOf(get('type').v).length);

function scale(k){
  const n=k.steps||11,out=[];
  for(let i=0;i<n;i++){
    const a=((k.steps?TA[i]:A0+i/(n-1)*(A1-A0))-90)*Math.PI/180,r=k.steps?46:44;
    const anchor=k.steps?(i===0?"end":i===n-1?"start":"middle"):"middle";
    out.push(`<text class="${k.steps?'p'+i:''}" x="${50+r*Math.cos(a)}" y="${50+r*Math.sin(a)+3}" text-anchor="${anchor}">${k.steps?types[i].label:i}</text>`);
  }
  return out.join('');
}
const knobHtml=k=>`
 <div class="k${k.steps?' wide':''}">
  <svg viewBox="${k.steps?'-30 0 160 100':'0 0 100 100'}" id="k-${k.id}" tabindex="0" role="slider" aria-label="${k.label}">
   <g class="scale">${scale(k)}</g>
   <circle class="ring" cx="50" cy="50" r="33"/>${k.steps?'':'<g class="ticks"></g>'}
   <g class="rot"><circle class="cap" cx="50" cy="50" r="27"/><line class="ptr" x1="50" y1="50" x2="50" y2="27"/></g>
  </svg>
  <span>${k.label}</span>
 </div>`;
const odHtml=`<div class="od"><button id="odBtn" class="odbtn" aria-pressed="false" aria-label="Overdrive"><svg viewBox="0 0 56 96" aria-hidden="true"><circle class="lamp" cx="28" cy="26" r="5"/><circle class="ol" cx="28" cy="60" r="17" stroke-width="2.5"/><circle class="ol" cx="28" cy="60" r="11" stroke-width="1.4"/></svg></button><span>OVERDRIVE</span></div>`;
const ltHtml=`<div class="lt"><button id="ltBtn" class="ltbtn" aria-pressed="false" aria-label="Light version"><svg viewBox="0 0 40 96" aria-hidden="true"><rect class="ol" x="5" y="34" width="30" height="40" rx="6" stroke-width="2"/><circle class="ol" cx="20" cy="54" r="7" stroke-width="1.6"/><g class="lever"><line class="stick" x1="20" y1="54" x2="20" y2="26"/><circle class="tip" cx="20" cy="25" r="5"/></g></svg></button><span>LIGHT</span></div>`;
const badgeHtml=`<svg class="badge" viewBox="100 80 185 180" role="img" aria-label="Wojciech Hryniewicki logo"><g class="ln" stroke-width="6"><line x1="109.5" y1="84" x2="109.5" y2="256"/><line x1="192" y1="84" x2="192" y2="256"/><line x1="274" y1="84" x2="274" y2="256"/><line x1="151" y1="167" x2="151" y2="256"/><line x1="148" y1="169.5" x2="233.5" y2="169.5" stroke-width="5"/></g></svg>`;
document.getElementById('knobs').innerHTML=`<div class="left">${knobHtml(knobs[0])}${odHtml}</div>${badgeHtml}<div class="right">${ltHtml}${knobHtml(knobs[1])}</div>`;
/* Light switch: remembers the choice on this device */
const ltBtn=document.getElementById('ltBtn');
function setMode(light){
  document.documentElement.dataset.mode=light?'light':'dark';
  ltBtn.classList.toggle('on',light);ltBtn.setAttribute('aria-pressed',light);
  try{localStorage.setItem('wh-mode',light?'light':'dark')}catch(e){}
}
let saved=null;try{saved=localStorage.getItem('wh-mode')}catch(e){}
setMode(saved==='light');
ltBtn.addEventListener('click',()=>setMode(!ltBtn.classList.contains('on')));
const odBtn=document.getElementById('odBtn');
/* Overdrive: if the Type in use has no videos for the new mode, the Type knob turns by itself,
   to SONGS when it can, otherwise to the first Type that has videos */
odBtn.addEventListener('click',()=>{
  acted=true;
  od=!od;
  const ty=get('type');
  if(!usable(ty.v)){
    const songs=types.findIndex(t=>t.label==="SONGS");
    const pick=songs>=0&&usable(songs)?songs:types.findIndex((t,i)=>usable(i));
    if(pick<0){od=!od;return}
    ty.v=pick;
  }
  odBtn.setAttribute('aria-pressed',od);odBtn.classList.toggle('on',od);render();
});

/* Player: YouTube without its buttons. Our own cover handles play and pause. */
const frame=document.getElementById('frame'),cover=document.getElementById('cover'),poster=document.getElementById('poster');
let yt=null,ready=false,playing=false,current=null,fallback=0;

const logo=document.getElementById('logo'),lgPlay=document.getElementById('lgPlay'),lgFill=document.getElementById('lgFill'),lgProg=document.getElementById('lgProg'),lgSeek=document.getElementById('lgSeek'),lgVol=document.getElementById('lgVol'),lgVolZ=document.getElementById('lgVolZ');
let started=false;
/* on: the thumbnail covers the video (before playing and when paused), so YouTube's own buttons never show */
let posterT=0;
function showPoster(on){
  /* The thumbnail is lifted only after the video has played for 0.7 s, so YouTube's own
     play/pause symbols (shown at start, on pause and when switching) are never seen */
  clearTimeout(posterT);
  if(on)poster.classList.remove('hidden');
  else posterT=setTimeout(()=>{if(playing)poster.classList.add('hidden')},700);
  cover.setAttribute('aria-label',on?'Play video':'Pause video');
  logo.classList.toggle('playing',!on);lgPlay.setAttribute('aria-label',on?'Play':'Pause');
  showCtrls();
}
/* Upright videos use the upright thumbnail when YouTube has one. If not, the normal thumbnail is used:
   its upright picture sits in the middle, and the box crops away the black sides. */
function thumb(v){return `url(https://i.ytimg.com/vi/${v.id}/${upright(v)&&v.oar?'oardefault':'hqdefault'}.jpg)`}
function setFill(f){
  lgFill.style.width=(f*46.22)+'%';lgProg.style.left=(25.95+f*46.22)+'%';lgSeek.setAttribute('aria-valuenow',Math.round(f*100));
}
/* Shape check: YouTube keeps an "original shape" thumbnail (oardefault) for upright videos.
   If it exists and is taller than wide, the video is upright. If it is missing or wide, the video is wide.
   A shape set by hand in the library always wins. */
function upright(v){return v.f!==undefined?v.f:!!v.up}
for(const t of types)for(const v of [...t.clean,...t.overdrive]){
  const img=new Image();
  const done=()=>{if(v===current){frame.classList.toggle('short',v.up);poster.style.backgroundImage=thumb(v)}};
  img.onload=()=>{
    /* YouTube answers a missing thumbnail with a small grey 120x90 picture: treat that as "no thumbnail" */
    const real=!(img.naturalWidth===120&&img.naturalHeight===90);
    v.oar=real;v.up=v.f!==undefined?v.f:real&&img.naturalHeight>img.naturalWidth*1.1;done()};
  img.onerror=()=>{v.up=v.f!==undefined?v.f:false;done()};
  img.src=`https://i.ytimg.com/vi/${v.id}/oardefault.jpg`;
}

/* Backup: if the clean player cannot show a video, use YouTube's normal player for it */
const plain=document.getElementById('plain');
let apiFailed=false;
/* If YouTube's player script never loads, show every video with the normal player */
setTimeout(()=>{if(!ready){apiFailed=true;plainPlayer()}},6000);
function plainPlayer(auto){
  if(!current)return;
  plain.src=`https://www.youtube.com/embed/${current.id}?rel=0&playsinline=1${auto?'&autoplay=1':''}`;
  plain.classList.remove('hidden');cover.classList.add('hidden');frame.classList.add('plainmode');
}
/* Autoplay: once the visitor has used a control, a new video starts by itself
   when the knob comes to rest (so turning through several videos doesn't start each one) */
let acted=false,autoT=0;
function load(vid){
  current=vid;playing=false;started=false;setFill(0);frame.classList.remove('direct','plainmode');
  clearTimeout(autoT);
  if(acted)autoT=setTimeout(()=>{if(current===vid){if(ready&&!apiFailed)yt.playVideo();else if(apiFailed)plainPlayer(true)}},600);
  plain.classList.add('hidden');plain.removeAttribute('src');
  if(apiFailed){frame.classList.toggle('short',upright(vid));plainPlayer();return}
  frame.classList.toggle('short',upright(vid));
  poster.style.backgroundImage=thumb(vid);
  cover.classList.remove('hidden');showPoster(true);
  if(ready)yt.cueVideoById(vid.id);
}
function toggle(){
  if(!current)return;
  acted=true;
  if(!ready){plainPlayer();return}
  if(playing){playing=false;showPoster(true);yt.pauseVideo();return}
  yt.playVideo();
  /* If the phone refuses to start, hand the tap over to YouTube's own player */
  clearTimeout(fallback);
  fallback=setTimeout(()=>{const st=yt.getPlayerState?yt.getPlayerState():-1;if(!playing&&st!==3&&st!==1){cover.classList.add('hidden');frame.classList.add('direct','plainmode')}},4000);
}
/* Controls fade out 1 second after the last touch while playing; a touch or mouse move brings them back.
   A tap on the video first shows the controls, a second tap plays or pauses. */
const ctrls=document.getElementById('ctrls');let hideT=0,held=false;
function showCtrls(){
  ctrls.classList.remove('hide');clearTimeout(hideT);
  if(playing&&!held)hideT=setTimeout(()=>ctrls.classList.add('hide'),1000);
}
cover.addEventListener('click',()=>{if(ctrls.classList.contains('hide'))showCtrls();else toggle()});
frame.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')showCtrls()});
ctrls.addEventListener('pointerdown',()=>{held=true;showCtrls()});
addEventListener('pointerup',()=>{if(held){held=false;showCtrls()}});
ctrls.addEventListener('focusin',e=>{if(e.target.matches(':focus-visible')){held=true;showCtrls()}});   /* keyboard use keeps them visible */
ctrls.addEventListener('focusout',()=>{held=false;showCtrls()});

/* Jumping in the video: tap or drag on the logo's crossbar, arrow keys move 5 seconds */
let dragging=false;
function seekAt(x,bar){
  if(!ready)return;const r=bar.getBoundingClientRect(),d=yt.getDuration();if(!(d>0))return;
  const f=Math.max(0,Math.min(1,(x-r.left)/r.width));setFill(f);yt.seekTo(f*d,true);
}
function seekKey(e){
  if(!ready)return;const d=yt.getDuration();if(!(d>0))return;
  const step=e.key==="ArrowRight"?5:e.key==="ArrowLeft"?-5:0;if(!step)return;
  e.preventDefault();const t=Math.max(0,Math.min(d-1,yt.getCurrentTime()+step));yt.seekTo(t,true);setFill(t/d);
}

/* Logo player: first line plays and pauses, crossbar shows and moves the position, last line sets the volume */
lgPlay.addEventListener('click',toggle);
const hBar=logo.querySelector('.h'),vBar=logo.querySelector('.l4');
let lgDrag=false;
lgSeek.addEventListener('pointerdown',e=>{e.preventDefault();lgDrag=dragging=true;lgSeek.setPointerCapture(e.pointerId);seekAt(e.clientX,hBar)});
lgSeek.addEventListener('pointermove',e=>{if(lgDrag)seekAt(e.clientX,hBar)});
const lgEnd=()=>{lgDrag=dragging=false};
lgSeek.addEventListener('pointerup',lgEnd);lgSeek.addEventListener('pointercancel',lgEnd);
lgSeek.addEventListener('keydown',seekKey);
let vol=100;
function setVol(v){
  vol=Math.round(Math.max(0,Math.min(100,v)));
  lgVol.style.top=((256-vol/100*172-80)/180*100)+'%';
  lgVolZ.setAttribute('aria-valuenow',vol);
  if(ready){yt.setVolume(vol);vol?yt.unMute():yt.mute()}
}
const volAt=y=>{const r=vBar.getBoundingClientRect();setVol((r.bottom-y)/r.height*100)};
let vDrag=false;
lgVolZ.addEventListener('pointerdown',e=>{e.preventDefault();vDrag=true;lgVolZ.setPointerCapture(e.pointerId);volAt(e.clientY)});
lgVolZ.addEventListener('pointermove',e=>{if(vDrag)volAt(e.clientY)});
lgVolZ.addEventListener('pointerup',()=>vDrag=false);lgVolZ.addEventListener('pointercancel',()=>vDrag=false);
lgVolZ.addEventListener('keydown',e=>{
  if(e.key==="ArrowUp"||e.key==="ArrowRight"){e.preventDefault();setVol(vol+10)}
  if(e.key==="ArrowDown"||e.key==="ArrowLeft"){e.preventDefault();setVol(vol-10)}});
lgVolZ.addEventListener('wheel',e=>{e.preventDefault();setVol(vol+(e.deltaY<0?5:-5))},{passive:false});

/* Stop just before the end, so YouTube's end screen and suggestions never appear */
setInterval(()=>{
  if(!ready||!playing)return;
  const d=yt.getDuration(),t=yt.getCurrentTime();
  if(d>0&&!dragging)setFill(t/d);
  if(d>0&&d-t<0.4){yt.pauseVideo();yt.seekTo(0,true);playing=false;started=false;setFill(0);showPoster(true)}
},200);
window.onYouTubeIframeAPIReady=()=>{
  yt=new YT.Player('player',{
    videoId:current?current.id:"",
    playerVars:{controls:0,rel:0,iv_load_policy:3,playsinline:1,disablekb:1,fs:0,cc_load_policy:0},
    events:{
      onReady:()=>{ready=true;setVol(vol);if(current)yt.cueVideoById(current.id)},
      onError:()=>plainPlayer(),
      onStateChange:e=>{
        if(e.data===1){playing=true;started=true;cover.classList.remove('hidden');frame.classList.remove('direct','plainmode');showPoster(false)}
        if(e.data===2||e.data===0){playing=false;showPoster(true)}
      }
    }
  });
};
const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);

let lastN=0;
function render(){
  const list=listOf(get('type').v),n=list.length,g=get('gain');
  /* When the list changes (Type or Overdrive), keep the knob at about the same place */
  if(lastN&&lastN!==n)g.v=lastN>1?Math.round(g.v/(lastN-1)*(n-1)):0;
  g.v=Math.max(0,Math.min(n-1,g.v));
  if(lastN!==n){
    lastN=n;
    document.querySelector('#k-gain .ticks').innerHTML=list.map((v,j)=>{
      const a=(gainAng(j,n)-90)*Math.PI/180;
      return `<line x1="${50+36*Math.cos(a)}" y1="${50+36*Math.sin(a)}" x2="${50+39.5*Math.cos(a)}" y2="${50+39.5*Math.sin(a)}"/>`}).join('');
  }
  for(const k of knobs){
    const el=document.getElementById('k-'+k.id);
    el.querySelector('.rot').setAttribute('transform',`rotate(${ang(k)} 50 50)`);
    el.setAttribute('aria-valuemin',0);el.setAttribute('aria-valuemax',k.steps?k.steps-1:n-1);
    el.setAttribute('aria-valuenow',k.v);
    el.setAttribute('aria-valuetext',k.id==="type"?types[k.v].name+(od?", overdrive":""):`video ${g.v+1} of ${n}`);
  }
  /* Type names without videos in this mode are dimmed, and the knob skips them */
  types.forEach((t,i)=>document.querySelector('#k-type .p'+i).classList.toggle('off',!usable(i)));
  if(list[g.v]!==current)load(list[g.v]);
}
/* Move a knob a number of steps from a starting point.
   Gain: one step = one video. Type: one step = the next Type that has videos (empty ones are skipped). */
function stepFrom(k,from,steps){
  acted=true;
  if(k.steps){
    const U=types.map((t,i)=>i).filter(usable);
    const p=U.indexOf(from);if(p<0)return U[0]??from;
    k.v=U[Math.max(0,Math.min(U.length-1,p+steps))];
  }else{
    const n=listOf(get('type').v).length;
    k.v=Math.max(0,Math.min(n-1,from+steps));
  }
  render();
}
/* Jump to the number or name nearest to where the knob's scale was tapped */
function pickAt(k,el,pt){
  acted=true;
  if(Math.hypot(pt.x-50,pt.y-50)<8)return;                 /* the very centre has no direction */
  const a=Math.atan2(pt.x-50,50-pt.y)*180/Math.PI;          /* 0 at the top, clockwise */
  if(k.steps){
    /* the name nearest to where the knob was tapped (names or knob body) */
    let best=-1,bd=1e9;
    el.querySelectorAll('.scale text').forEach((t,i)=>{
      const b=t.getBBox(),out=Math.hypot(pt.x-50,pt.y-50)>35;
      const d=out?Math.hypot(b.x+b.width/2-pt.x,b.y+b.height/2-pt.y):Math.abs(a-TA[i]);
      if(d<bd){bd=d;best=i}});
    if(best>=0&&usable(best)){k.v=best;render()}            /* a dimmed name does nothing */
  }else{
    const n=listOf(get('type').v).length;if(n<2)return;
    k.v=Math.round((Math.max(A0,Math.min(A1,a))-A0)/(A1-A0)*(n-1));render();
  }
}
/* Drag distance for one step: Type 40px, Gain spreads about 160px over the whole list (at least 14px per video) */
const stepPx=k=>{if(k.steps)return 40;const n=listOf(get('type').v).length;return n>1?Math.max(14,160/(n-1)):1e9};
for(const k of knobs){
  /* Like a real knob:
     - tap anywhere: the knob turns to that spot (or to the number or name you tapped)
     - grab the edge and drag around: the pointer follows your finger
     - grab the middle and drag up or down: one step at a time */
  const el=document.getElementById('k-'+k.id);let x0,y0,v0,down=false,drag=false,round=false,pt0=null;
  const svgPt=e=>new DOMPoint(e.clientX,e.clientY).matrixTransform(el.getScreenCTM().inverse());
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();el.focus({preventScroll:true});
    down=true;drag=false;x0=e.clientX;y0=e.clientY;v0=k.v;pt0=svgPt(e);
    round=Math.hypot(pt0.x-50,pt0.y-50)>18;
    el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{
    if(!down)return;
    if(!drag&&Math.hypot(e.clientX-x0,e.clientY-y0)>6)drag=true;
    if(!drag)return;
    if(round)pickAt(k,el,svgPt(e));else stepFrom(k,v0,Math.round((y0-e.clientY)/stepPx(k)))});
  el.addEventListener('pointerup',()=>{if(down&&!drag)pickAt(k,el,pt0);down=drag=false});
  el.addEventListener('pointercancel',()=>{down=drag=false});
  el.addEventListener('wheel',e=>{e.preventDefault();stepFrom(k,k.v,e.deltaY<0?1:-1)},{passive:false});
  el.addEventListener('keydown',e=>{
    if(e.key==="ArrowUp"||e.key==="ArrowRight"){e.preventDefault();stepFrom(k,k.v,1)}
    if(e.key==="ArrowDown"||e.key==="ArrowLeft"){e.preventDefault();stepFrom(k,k.v,-1)}});
}
/* Start on the first Type that has videos (in case a list is ever left empty) */
{const ty=get('type');if(!usable(ty.v))ty.v=Math.max(0,types.findIndex((t,i)=>usable(i)))}
render();
}
</script>
</body>
