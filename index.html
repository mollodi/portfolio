<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wojciech Hryniewicki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>
/* Dark, tidy amp face: one column, knobs and logo on one line, video below at the same width */
:root{color-scheme:dark;--bg:#0b0b0c;--ink:#ece9e1;--dim:#8f8c85;--line:#1d1d20;
  --w:min(100%,880px,calc((100svh - 385px) * 16 / 9))}
@supports not (height:1svh){:root{--w:min(100%,880px,calc((100vh - 385px) * 16 / 9))}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;overflow-x:clip}
.page{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding:32px max(4vw,16px) 0}
.wrap{width:max(var(--w),min(100%,560px));margin:auto;container-type:inline-size}

/* Gain left, logo exactly centred, Type right */
.knobs{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;margin:0 auto 32px;max-width:600px}
.knobs>.left{justify-self:start;display:flex;align-items:flex-start;gap:14px}
/* Overdrive: a footswitch with a red lamp, same height and label line as the knobs */
.od{display:flex;flex-direction:column;align-items:center;gap:8px}
.odbtn{width:60px;height:96px;border:0;padding:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.odbtn .led{width:10px;height:10px;border-radius:50%;background:#3a0d0b;box-shadow:inset 0 1px 2px #000;transition:background .15s,box-shadow .15s}
.odbtn.on .led{background:radial-gradient(circle at 35% 35%,#ffb3aa,#e0312a 55%,#8a140f);box-shadow:0 0 10px #e0312a}
.odbtn .sw{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d9d9dc,#8c8c92 60%,#4a4a4f);box-shadow:0 0 0 3px #1c1c1f,0 3px 6px #000;transition:transform .08s}
.odbtn:active .sw{transform:scale(.94)}
.odbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.od>span{font:600 11px/13px Oswald,Impact,sans-serif;letter-spacing:.1em;color:var(--ink)}
.knobs>.k:last-child{justify-self:end}
.k{display:flex;flex-direction:column;align-items:center;gap:8px}
.k svg{display:block;width:96px;height:96px;touch-action:none;cursor:grab;outline:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.k.wide svg{width:154px}
.k span{font:600 13px/1 Oswald,Impact,sans-serif;letter-spacing:.14em;color:var(--ink)}
.scale text{font:500 9px system-ui,sans-serif;fill:var(--dim);letter-spacing:.02em}
.k.wide .scale text{font-size:9.5px;letter-spacing:.08em}
.cap{fill:url(#capg)}
.ptr{stroke:#161616;stroke-width:3.5;stroke-linecap:round}
.ring{fill:none;stroke:#222226;stroke-width:2}
.logo{display:block;width:96px;height:96px}
.logo .ln{stroke:url(#logog);fill:none}

/* Video: frameless. Shorts get the same height as a wide video, so nothing jumps */
/* The stage keeps one fixed height for every video, so nothing moves when a knob turns.
   Wide videos sit in its vertical centre, Shorts stand inside it. */
.stage{display:flex;justify-content:center;align-items:center;
  height:calc(min(100vw - 32px,880px) * 9 / 16);height:calc(100cqw * 9 / 16)}
.frame{position:relative;overflow:hidden;background:#000;border-radius:8px;aspect-ratio:16/9;width:100%;
  box-shadow:0 0 0 1px var(--line),0 16px 40px -24px #000}
.frame.short{aspect-ratio:9/16;width:auto;height:100%}
#player,.frame iframe{position:absolute;left:0;width:100%;border:0}
/* Trick: the player is 3 times taller than the box. The video sits in the middle third,
   while YouTube's title bar (top) and logo (bottom) fall outside the box and are cut off. */
#player,.frame iframe{top:-100%;height:300%;pointer-events:none}
.frame.direct iframe{pointer-events:auto}
.frame iframe#plain{top:0;height:100%;pointer-events:auto;z-index:2}
.frame iframe#plain.hidden{display:none}
.cover{position:absolute;inset:0;border:0;padding:0;margin:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.poster{position:absolute;inset:0;background:#000 center/cover no-repeat;display:grid;place-items:center}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 55%,#0006)}
.poster .btn{position:relative;z-index:1;width:68px;height:68px;border-radius:50%;background:#0b0b0cb3;
  box-shadow:inset 0 0 0 1px #ffffff40;display:grid;place-items:center;transition:transform .15s,background .15s}
.poster .btn svg{margin-left:3px}
.cover:hover .btn,.cover:focus-visible .btn{transform:scale(1.06);background:#0b0b0ce6}
.cover:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.hidden{display:none}
.cover{z-index:3}.poster.paused{background:none!important}.poster.paused::after{display:none}

/* Watermark: the logo in the corner of every video */
.wm{position:absolute;z-index:4;right:14px;bottom:48px;width:34px;height:34px;pointer-events:none;opacity:.9}
.wm .ln{stroke:url(#logog);fill:none}
.frame.short .wm{width:28px;height:28px;right:10px}

/* Own control bar: play/pause and progress */
.bar{position:absolute;z-index:5;left:0;right:0;bottom:0;display:flex;align-items:center;gap:6px;padding:0 10px 2px 4px;height:44px;
  background:linear-gradient(#0000,#000b);transition:opacity .25s}
/* While playing, the bar hides and the watermark moves down into the corner */
.frame.isplaying .bar{opacity:0;pointer-events:none}
.frame.isplaying .wm{bottom:14px}
.pp{width:40px;height:40px;flex:none;border:0;background:none;color:#fff;display:grid;place-items:center;cursor:pointer;border-radius:50%;-webkit-tap-highlight-color:transparent}
.pp path{fill:currentColor}
.track{flex:1;height:32px;display:flex;align-items:center;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
.rail{position:relative;width:100%;height:3px;border-radius:2px;background:#ffffff38}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:#ece9e1}
.fill::after{content:"";position:absolute;right:-6px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#ece9e1;transform:scale(0);transition:transform .12s}
.track:hover .fill::after,.track.drag .fill::after,.track:focus-visible .fill::after{transform:scale(1)}
.pp:focus-visible,.track:focus-visible{outline:2px solid #ece9e1;outline-offset:2px}
.frame.plainmode .bar{display:none}

/* Temporary link line */
.linkline{margin:14px 0 0;text-align:center;font-size:13px;color:var(--dim);overflow-wrap:anywhere}
.linkline a{color:var(--ink)}
.linkline button{margin-left:6px;min-height:32px;padding:0 12px;border:1px solid #3a3a3f;border-radius:16px;background:none;color:var(--ink);font:inherit;cursor:pointer}

/* Footer */
footer{width:100%;max-width:880px;margin:48px auto 0;padding:24px 0 28px;border-top:1px solid var(--line)}
.social{list-style:none;margin:0;padding:0;display:flex;justify-content:center;flex-wrap:wrap;gap:8px 36px}
.social a{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;color:var(--dim);text-decoration:none;
  font:600 13px/1 Oswald,Impact,sans-serif;letter-spacing:.16em;transition:color .15s}
.social a:hover,.social a:focus-visible{color:var(--ink)}
.social a:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px}

@media(max-width:600px){
  .page{padding:20px 12px 0}
  .wrap{margin:0 auto}
  footer{margin-top:auto}
  .knobs{margin-bottom:20px;max-width:none;display:flex;justify-content:space-between}
  .k svg{width:80px;height:80px}.k.wide svg{width:128px}
  .logo{width:56px;height:56px;margin-top:12px}
  .knobs>.left{gap:4px}
  .odbtn{width:52px;height:80px;gap:10px}.odbtn .sw{width:32px;height:32px}
  .od>span{font-size:10px;letter-spacing:.06em}
  /* Phone: video goes edge to edge */
  .stage{margin:0 -12px;height:min(58vh,calc(100vw * 1.05));height:min(58svh,calc(100cqw * 1.05))}
  .frame{border-radius:0;box-shadow:none}
  .frame.short{height:100%;border-radius:10px}
  .social{gap:4px 24px}
}
@media(max-width:380px){
  .k svg{width:72px;height:72px}.k.wide svg{width:116px}
  .odbtn{width:46px;height:72px}.odbtn .sw{width:28px;height:28px}
  .logo{width:46px;height:46px}
  .od>span{font-size:9.5px;letter-spacing:.03em}
  .knobs>.left{gap:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(forced-colors:active){
  .cap{fill:Canvas;stroke:CanvasText;stroke-width:2}.ptr{stroke:Highlight}.ring{stroke:CanvasText}
  .scale text{fill:CanvasText}.frame{border:1px solid CanvasText}
  .logo .ln{stroke:CanvasText}
  .poster .btn{border:2px solid CanvasText;background:Canvas}.poster .btn path{fill:CanvasText}
  .cover:focus-visible{outline-color:Highlight}
  .odbtn .sw{background:Canvas;border:2px solid ButtonText;box-shadow:none}.odbtn .led{forced-color-adjust:none;background:Canvas;border:1px solid CanvasText;box-shadow:none}
  .odbtn.on .led{background:Highlight;border-color:Highlight}.odbtn:focus-visible{outline-color:Highlight}
  .wm .ln{stroke:CanvasText}.bar{background:Canvas;border-top:1px solid CanvasText}.pp{color:ButtonText;border:1px solid ButtonText}
  .rail{background:GrayText}.fill,.fill::after{background:Highlight}.pp:focus-visible,.track:focus-visible{outline-color:Highlight}
  .linkline a{color:LinkText}.linkline button{color:ButtonText;border-color:ButtonText}
  footer{border-top-color:CanvasText}.social a{color:LinkText}.social a:focus-visible{outline-color:Highlight}
}
</style>
</head>
<body>
<div class="page"><div class="wrap">
  <div class="knobs" id="knobs"></div>
  <template id="logoTpl">
  <svg class="logo" viewBox="100 80 185 180" role="img" aria-label="Wojciech Hryniewicki logo">
    <g class="ln" stroke-width="6" stroke-linecap="butt">
      <line x1="109.5" y1="84" x2="109.5" y2="256"/>
      <line x1="192" y1="84" x2="192" y2="256"/>
      <line x1="274" y1="84" x2="274" y2="256"/>
      <line x1="151" y1="167" x2="151" y2="256"/>
      <line x1="148" y1="169.5" x2="233.5" y2="169.5" stroke-width="5"/>
    </g>
  </svg>
  </template>
  <div class="stage">
    <div class="frame" id="frame">
      <div id="player"></div>
      <iframe id="plain" class="hidden" title="Video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      <button class="cover" id="cover" aria-label="Play video">
        <span class="poster" id="poster"><span class="btn"><svg width="26" height="26" viewBox="0 0 22 22" aria-hidden="true"><path d="M7 4l12 7-12 7z" fill="#fff"/></svg></span></span>
      </button>
      <svg class="wm" viewBox="100 80 185 180" aria-hidden="true"><g class="ln" stroke-width="6"><line x1="109.5" y1="84" x2="109.5" y2="256"/><line x1="192" y1="84" x2="192" y2="256"/><line x1="274" y1="84" x2="274" y2="256"/><line x1="151" y1="167" x2="151" y2="256"/><line x1="148" y1="169.5" x2="233.5" y2="169.5" stroke-width="5"/></g></svg>
      <div class="bar" id="bar">
        <button class="pp" id="pp" aria-label="Play"><svg width="18" height="18" viewBox="0 0 22 22" aria-hidden="true"><path id="ppIcon" d="M6 3l14 8-14 8z"/></svg></button>
        <div class="track" id="track" tabindex="0" role="slider" aria-label="Video position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="rail"><div class="fill" id="fill"></div></div></div>
      </div>
    </div>
  </div>
  <!-- TEMPORARY: link of the video on screen, so wrong shapes can be reported. Remove when done. -->
  <p class="linkline">Video link: <a id="vlink" href="#" target="_blank" rel="noopener"></a> <button id="copy" type="button">Copy</button></p>
</div>
<footer>
  <ul class="social">
    <li><a href="https://www.instagram.com/paradoxognososynggrafikos/" target="_blank" rel="noopener">INSTAGRAM</a></li>
    <li><a href="https://soundcloud.com/wojciech-hryniewicki/" target="_blank" rel="noopener">SOUNDCLOUD</a></li>
    <li><a href="https://www.youtube.com/@wojciechhryniewicki" target="_blank" rel="noopener">YOUTUBE</a></li>
  </ul>
</footer>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="logog" gradientUnits="userSpaceOnUse" x1="0" y1="84" x2="0" y2="256"><stop offset="0" stop-color="#990000"/><stop offset=".72" stop-color="#3a0000"/><stop offset="1" stop-color="#370000"/></linearGradient>
  <radialGradient id="capg" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fbf6e7"/><stop offset=".7" stop-color="#d9d0b8"/><stop offset="1" stop-color="#9c9480"/></radialGradient>
</defs></svg>

<script>
{
/* Each type lists its videos from the lightest to the heaviest.
   Gain 0 shows the first (lightest), gain 10 the last (heaviest).
   s:1 marks a /shorts/ link (first guess). f:true or f:false sets the shape by hand (upright or wide). */
const types=[
  {label:"KEYS",name:"Keys",v:[{id:"im13LzBOD_w"},{id:"DEANSHDWww0"},{id:"AG3WGAEKPGY"},{id:"6VrBtL-pBQk"}]},
  {label:"GUITAR",name:"Guitar Only",v:[{id:"74Fn6fPGEnE"},{id:"quwbFH3pn8A"}]},
  {label:"SONGS",name:"Full Songs",v:[{id:"2iNbePz8Ao0",s:1},{id:"n-DhYip3wh8",s:1},{id:"i6rgYLaGDbg",f:true},{id:"tCl8g3aSStY"},{id:"ZwpYgKk2IPk"},{id:"ggS8HsNWE3s",s:1},{id:"73ziziUBd6U",s:1}]}
];
/* Overdrive on: only the two heaviest songs, Gain picks between them */
const OD={name:"Overdrive",v:[{id:"uso0dnW1UiI"},{id:"x3fvDBi8R0g"}]};
let od=false;
const knobs=[
  {id:"gain",label:"GAIN",v:0,steps:0},
  {id:"type",label:"TYPE",v:0,steps:3}
];
const A0=-135,A1=135,S0=-55,S1=55;
const get=id=>knobs.find(k=>k.id===id);
const ang=k=>k.steps?S0+k.v/(k.steps-1)*(S1-S0):A0+k.v/10*(A1-A0);

function scale(k){
  const n=k.steps||11,out=[];
  for(let i=0;i<n;i++){
    const a=((k.steps?S0+i/(n-1)*(S1-S0):A0+i/(n-1)*(A1-A0))-90)*Math.PI/180,r=44;
    const anchor=k.steps?(i===0?"end":i===n-1?"start":"middle"):"middle";
    out.push(`<text x="${50+r*Math.cos(a)}" y="${50+r*Math.sin(a)+3}" text-anchor="${anchor}">${k.steps?types[i].label:i}</text>`);
  }
  return out.join('');
}
const knobHtml=k=>`
 <div class="k${k.steps?' wide':''}">
  <svg viewBox="${k.steps?'-30 0 160 100':'0 0 100 100'}" id="k-${k.id}" tabindex="0" role="slider" aria-label="${k.label}">
   <g class="scale">${scale(k)}</g>
   <circle class="ring" cx="50" cy="50" r="33"/>
   <g class="rot"><circle class="cap" cx="50" cy="50" r="28"/><line class="ptr" x1="50" y1="50" x2="50" y2="26"/></g>
  </svg>
  <span>${k.label}</span>
 </div>`;
const odHtml=`<div class="od"><button id="odBtn" class="odbtn" aria-pressed="false" aria-label="Overdrive"><span class="led" aria-hidden="true"></span><span class="sw" aria-hidden="true"></span></button><span>OVERDRIVE</span></div>`;
document.getElementById('knobs').innerHTML=`<div class="left">${knobHtml(knobs[0])}${odHtml}</div>`+document.getElementById('logoTpl').innerHTML+knobHtml(knobs[1]);
const odBtn=document.getElementById('odBtn');
odBtn.addEventListener('click',()=>{od=!od;odBtn.setAttribute('aria-pressed',od);odBtn.classList.toggle('on',od);render()});

/* Player: YouTube without its buttons. Our own cover handles play and pause. */
const frame=document.getElementById('frame'),cover=document.getElementById('cover'),poster=document.getElementById('poster');
let yt=null,ready=false,playing=false,current=null,fallback=0;

const pp=document.getElementById('pp'),ppIcon=document.getElementById('ppIcon'),track=document.getElementById('track'),fill=document.getElementById('fill');
const PLAY="M6 3l14 8-14 8z",PAUSE="M5 3h4v16H5zM13 3h4v16h-4z";
let started=false;
/* on: show the play button. Before the first play it sits on the thumbnail; after that, on the paused picture. */
function showPoster(on){
  poster.classList.toggle('hidden',!on);
  poster.classList.toggle('paused',on&&started);
  cover.setAttribute('aria-label',on?'Play video':'Pause video');
  ppIcon.setAttribute('d',on?PLAY:PAUSE);frame.classList.toggle('isplaying',!on);pp.setAttribute('aria-label',on?'Play':'Pause');
}
/* Upright videos use the upright thumbnail when YouTube has one. If not, the normal thumbnail is used:
   its upright picture sits in the middle, and the box crops away the black sides. */
function thumb(v){return `url(https://i.ytimg.com/vi/${v.id}/${upright(v)&&v.oar?'oardefault':'hqdefault'}.jpg)`}
function setFill(f){fill.style.width=(f*100)+'%';track.setAttribute('aria-valuenow',Math.round(f*100))}
/* Shape check: YouTube keeps an "original shape" thumbnail (oardefault) for upright videos.
   If it exists and is taller than wide, the video is upright. If it is missing or wide, the video is wide.
   Until the check is done, the link type (/shorts/ or not) is used as a first guess. */
function upright(v){return v.f!==undefined?v.f:v.up===undefined?!!v.s:v.up}
for(const t of [...types,OD])for(const v of t.v){
  const img=new Image();
  const done=()=>{if(v===current){frame.classList.toggle('short',v.up);poster.style.backgroundImage=thumb(v)}};
  img.onload=()=>{v.oar=true;v.up=v.f!==undefined?v.f:img.naturalHeight>img.naturalWidth*1.1;done()};
  img.onerror=()=>{v.up=v.f!==undefined?v.f:false;done()};
  img.src=`https://i.ytimg.com/vi/${v.id}/oardefault.jpg`;
}

/* Backup: if the clean player cannot show a video, use YouTube's normal player for it */
const plain=document.getElementById('plain');
let apiFailed=false;
/* If YouTube's player script never loads, show every video with the normal player */
setTimeout(()=>{if(!ready){apiFailed=true;plainPlayer()}},6000);
function plainPlayer(){
  if(!current)return;
  plain.src=`https://www.youtube.com/embed/${current.id}?rel=0&playsinline=1`;
  plain.classList.remove('hidden');cover.classList.add('hidden');frame.classList.add('plainmode');
}
function load(vid){
  current=vid;playing=false;started=false;setFill(0);frame.classList.remove('direct','plainmode');
  const l=`https://youtu.be/${vid.id}`;vlink.href=l;vlink.textContent=l;
  plain.classList.add('hidden');plain.removeAttribute('src');
  if(apiFailed){frame.classList.toggle('short',upright(vid));plainPlayer();return}
  frame.classList.toggle('short',upright(vid));
  poster.style.backgroundImage=thumb(vid);
  cover.classList.remove('hidden');showPoster(true);
  if(ready)yt.cueVideoById(vid.id);
}
function toggle(){
  if(!current)return;
  if(!ready){plainPlayer();return}
  if(playing){yt.pauseVideo();return}
  yt.playVideo();showPoster(false);
  /* If the phone refuses to start, hand the tap over to YouTube's own player */
  clearTimeout(fallback);
  fallback=setTimeout(()=>{if(!playing){cover.classList.add('hidden');frame.classList.add('direct','plainmode')}},1500);
}
cover.addEventListener('click',toggle);pp.addEventListener('click',toggle);

/* Progress bar: tap or drag to jump, arrow keys move 5 seconds */
let dragging=false;
function seekAt(x){
  if(!ready)return;const r=track.getBoundingClientRect(),d=yt.getDuration();if(!(d>0))return;
  const f=Math.max(0,Math.min(1,(x-r.left)/r.width));setFill(f);yt.seekTo(f*d,true);
}
track.addEventListener('pointerdown',e=>{e.preventDefault();dragging=true;track.classList.add('drag');track.setPointerCapture(e.pointerId);seekAt(e.clientX)});
track.addEventListener('pointermove',e=>{if(dragging)seekAt(e.clientX)});
const endDrag=()=>{dragging=false;track.classList.remove('drag')};
track.addEventListener('pointerup',endDrag);track.addEventListener('pointercancel',endDrag);
track.addEventListener('keydown',e=>{
  if(!ready)return;const d=yt.getDuration();if(!(d>0))return;
  const step=e.key==="ArrowRight"?5:e.key==="ArrowLeft"?-5:0;if(!step)return;
  e.preventDefault();const t=Math.max(0,Math.min(d-1,yt.getCurrentTime()+step));yt.seekTo(t,true);setFill(t/d);
});

/* TEMPORARY: copy the link of the video on screen */
const vlink=document.getElementById('vlink'),copyBtn=document.getElementById('copy');
copyBtn.addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(vlink.href);copyBtn.textContent='Copied'}
  catch(e){const r=document.createRange();r.selectNodeContents(vlink);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);copyBtn.textContent='Selected'}
  setTimeout(()=>copyBtn.textContent='Copy',1500);
});
/* Stop just before the end, so YouTube's end screen and suggestions never appear */
setInterval(()=>{
  if(!ready||!playing)return;
  const d=yt.getDuration(),t=yt.getCurrentTime();
  if(d>0&&!dragging)setFill(t/d);
  if(d>0&&d-t<0.4){yt.pauseVideo();yt.seekTo(0,true);playing=false;started=false;setFill(0);showPoster(true)}
},200);
window.onYouTubeIframeAPIReady=()=>{
  yt=new YT.Player('player',{
    videoId:current?current.id:"",
    playerVars:{controls:0,rel:0,iv_load_policy:3,playsinline:1,disablekb:1,fs:0,cc_load_policy:0},
    events:{
      onReady:()=>{ready=true;yt.unMute();if(current)yt.cueVideoById(current.id)},
      onError:()=>plainPlayer(),
      onStateChange:e=>{
        if(e.data===1){playing=true;started=true;cover.classList.remove('hidden');showPoster(false)}
        if(e.data===2||e.data===0){playing=false;showPoster(true)}
      }
    }
  });
};
const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);

function render(){
  const t=od?OD:types[get('type').v],list=t.v;
  const i=Math.min(list.length-1,Math.floor(get('gain').v/10*list.length));
  for(const k of knobs){
    const el=document.getElementById('k-'+k.id);
    el.querySelector('.rot').setAttribute('transform',`rotate(${ang(k)} 50 50)`);
    el.setAttribute('aria-valuemin',0);el.setAttribute('aria-valuemax',k.steps?k.steps-1:10);
    el.setAttribute('aria-valuenow',k.v);
    el.setAttribute('aria-valuetext',k.id==="type"?types[k.v].name:`${k.v}, video ${i+1} of ${list.length}`);
  }
  if(list[i]!==current)load(list[i]);
}
function set(k,v){
  k.v=k.steps?Math.max(0,Math.min(k.steps-1,Math.round(v))):Math.max(0,Math.min(10,Math.round(v*10)/10));
  render();
}
for(const k of knobs){
  const el=document.getElementById('k-'+k.id);let y0,v0,drag=false;
  el.addEventListener('pointerdown',e=>{e.preventDefault();drag=true;y0=e.clientY;v0=k.v;el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{if(drag)set(k,v0+(y0-e.clientY)/(k.steps?40:14))});
  el.addEventListener('pointerup',()=>drag=false);el.addEventListener('pointercancel',()=>drag=false);
  el.addEventListener('wheel',e=>{e.preventDefault();set(k,k.v+(e.deltaY<0?1:-1)*(k.steps?1:.5))},{passive:false});
  el.addEventListener('keydown',e=>{const step=k.steps?1:.5;
    if(e.key==="ArrowUp"||e.key==="ArrowRight"){e.preventDefault();set(k,k.v+step)}
    if(e.key==="ArrowDown"||e.key==="ArrowLeft"){e.preventDefault();set(k,k.v-step)}});
}
render();
}
</script>
</body>
